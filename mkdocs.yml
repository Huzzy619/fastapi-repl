site_name: fastapi-repl
site_description: Django-style shell_plus for FastAPI and friends.
repo_url: https://github.com/huzzyk/fastapi-repl
repo_name: huzzyk/fastapi-repl
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - CLI reference: cli.md
  - Guides:
      - SQLAlchemy: guides/sqlalchemy.md
      - SQLModel: guides/sqlmodel.md
      - Tortoise ORM: guides/tortoise.md
      - Async and await: guides/async.md
      - Interfaces: guides/interfaces.md
      - Writing an adapter: guides/writing-adapters.md
  - Recipes: recipes.md
  - Coming from Django: migrating-from-django.md
  - Security: security.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Python API: api.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
