[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fastapi-repl"
dynamic = ["version"]
description = "A Django shell_plus style interactive shell for FastAPI, Starlette and Litestar projects, with models, engine and session preloaded and top-level await."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Huzzy" }]
keywords = [
  "fastapi",
  "shell",
  "repl",
  "shell_plus",
  "ipython",
  "sqlalchemy",
  "sqlmodel",
  "tortoise-orm",
  "cli",
  "typer",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "Framework :: IPython",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Software Development :: Debuggers",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ipython = ["ipython>=8.10"]
ptpython = ["ptpython>=3.0.20"]
bpython = ["bpython>=0.24"]
jupyter = ["ipykernel>=6.20", "jupyterlab>=4.0"]
sqlalchemy = ["sqlalchemy>=2.0"]
sqlmodel = ["sqlmodel>=0.0.14"]
tortoise = ["tortoise-orm>=0.21"]
all = [
  "fastapi-repl[ipython,ptpython,bpython,jupyter,sqlalchemy,sqlmodel,tortoise]",
]

[project.scripts]
fastapi-repl = "fastapi_repl.cli:main"

[project.entry-points."fastapi_repl.adapters"]
sqlalchemy = "fastapi_repl.adapters.sqlalchemy:SQLAlchemyAdapter"
sqlmodel = "fastapi_repl.adapters.sqlmodel:SQLModelAdapter"
tortoise = "fastapi_repl.adapters.tortoise:TortoiseAdapter"

[project.urls]
Homepage = "https://github.com/Huzzy619/fastapi-repl"
Documentation = "https://huzzy619.github.io/fastapi-repl"
Repository = "https://github.com/Huzzy619/fastapi-repl"
Issues = "https://github.com/Huzzy619/fastapi-repl/issues"
Changelog = "https://github.com/Huzzy619/fastapi-repl/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "ipython>=8.10",
  "ptpython>=3.0.20",
  "bpython>=0.24; sys_platform != 'win32'",
  "ipykernel>=6.29",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "sqlmodel>=0.0.14",
  "tortoise-orm>=0.21",
  "tzdata>=2024.1",  # Windows has no system zoneinfo; Tortoise DatetimeField needs UTC
  "fastapi>=0.110",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[tool.hatch.version]
path = "src/fastapi_repl/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_repl"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "mkdocs.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:tortoise.*"]

[tool.coverage.run]
source = ["fastapi_repl"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "PT"]
ignore = [
  "PLR0911", # too many return statements
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLR2004", # magic values
  "PLR0917", # too many positional arguments (typer commands, event listeners)
  "PLC0415", # imports inside functions keep optional dependencies optional
  "B008",    # typer options in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "PLW", "PT018", "S"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingModuleSource = false
